name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Auto Accept SDK Licenses
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer
        
        # Buat folder lisensi Android dan setujui semua lisensi di awal
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer android pdm || true

    - name: Build APK
      run: |
        # Setujui lisensi SDK secara otomatis lewat pipeline
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Penilaian-APK
        path: bin/*.apk
