name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Build APK
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Penilaian-APK
        path: .buildozer/android/platform/build-arm64-v8a/dists/*/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Upload Bin Artifact (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Penilaian-Bin
        path: bin/
